<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DAR.COM — showreel</title>
<meta name="viewport" content="width=1920, height=1080">
<style>
@font-face{font-family:"Display";src:url(data:font/woff2;base64,__FONT_B64__) format("woff2");font-weight:100 900;font-display:block}
html,body{margin:0;background:#0B0B0C;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0B0B0C;font-family:"Display",sans-serif;-webkit-font-smoothing:antialiased}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;display:none}
.layer>svg{position:absolute;left:0;top:0}
.a{position:absolute;white-space:nowrap;line-height:1}
</style>
</head>
<body>
<div id="stage"></div>
<svg id="defs" width="0" height="0" style="position:absolute"></svg>
<script>
/* DAR.COM — "THE DOOR" · 15 s · 120 BPM · 1920x1080
   Everything on screen is a pure function of time: window.seek(t). No CSS animations, no timers, no state between frames.
   One typeface (Montserrat, variable), three colours (vermilion, cobalt, cream) + black and white. */
(() => {
'use strict';
const G = __GLYPHS__;
const W = 1920, H = 1080, BEAT = 0.5, UPM = G.upm, CAP = G.capH;

/* ───────────── maths · colour · easing ───────────── */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const f1 = (n) => Math.round(n * 10) / 10, f2 = (n) => Math.round(n * 100) / 100;
const P = (t, t0, d) => clamp((t - t0) / d);                       // progress 0→1 of a move starting at t0, lasting d
const eo = (p, k = 6) => (1 - Math.exp(-k * p)) / (1 - Math.exp(-k));       // exponential out  (fast attack on the beat)
const ei = (p, k = 5) => (Math.exp(k * p) - 1) / (Math.exp(k) - 1);         // exponential in   (push-through)
const sp = (p, w = 11) => { const f = (x) => 1 - (1 + w * x) * Math.exp(-w * x); return f(p) / f(1); }; // critically damped spring, no overshoot
const kf = (t, keys, w = 7) => {                                   // spring-eased keyframes [[t, v], …]
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) return lerp(keys[i - 1][1], keys[i][1], sp(P(t, keys[i - 1][0], keys[i][0] - keys[i - 1][0]), w));
  return keys[keys.length - 1][1];
};
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const rgb = (c) => `rgb(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])})`;
const mixc = (a, b, k) => [0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * k);
const COL = { K: hex('#0B0B0C'), W: [255, 255, 255], CR: hex('#F1E9DB'), V: hex('#FF4A1C'), B: hex('#2236FF') };
const SHADOW = [12, 14, 52];                                         // shadows pick up the cobalt: no muddy greys
const shade = (c, k) => (k < 0 ? mixc(c, SHADOW, -k) : mixc(c, COL.W, k));
const deg = (d) => d * Math.PI / 180;

/* ───────────── dom helpers ───────────── */
const NS = 'http://www.w3.org/2000/svg';
const S = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const D = (css, parent, text) => { const e = document.createElement('div'); e.style.cssText = css; if (text !== undefined) e.textContent = text; if (parent) parent.appendChild(e); return e; };
const stage = document.getElementById('stage'), defs = document.getElementById('defs');
const mkLayer = (svg = true) => { const d = D('', stage); d.className = 'layer'; const s = svg ? S('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` }, d) : null; return { d, s }; };
const show = (L, on) => { const v = on ? 'block' : 'none'; if (L.d.style.display !== v) L.d.style.display = v; };
const type = (w, wd = 100, extra = '') => `font-family:Display,sans-serif;font-weight:${w};font-variation-settings:'wght' ${w};${extra}`;

/* motion blur that follows speed AND direction (an SVG blur with separate x / y deviations, set from the velocity) */
const BLUR_K = 0.0042, BLUR_MAX = 46, blurs = [];
const mkBlur = (ry = 30) => { const f = S('filter', { id: 'mb' + blurs.length, x: '-30%', y: `-${ry}%`, width: '160%', height: `${100 + 2 * ry}%`, 'color-interpolation-filters': 'sRGB' }, defs); blurs.push(S('feGaussianBlur', { stdDeviation: '0 0' }, f)); return blurs.length - 1; };
const setBlur = (i, el, vx, vy) => {
  const sx = Math.min(BLUR_MAX, Math.abs(vx) * BLUR_K), sy = Math.min(BLUR_MAX, Math.abs(vy) * BLUR_K);
  if (sx + sy < 0.4) { if (el.style.filter) el.style.filter = ''; return; }
  blurs[i].setAttribute('stdDeviation', `${f2(sx)} ${f2(sy)}`); el.style.filter = `url(#mb${i})`;
};
const vel = (fn, t) => { const d = 1 / 75, a = fn(t - d), b = fn(t); return [(b[0] - a[0]) / d, (b[1] - a[1]) / d]; };   // backward difference: zero speed on the very first frame

/* ───────────── glyphs (outlines at two widths, interpolated) ───────────── */
const glyphAdv = (ch, k) => lerp(G.w62[ch].adv, G.w125[ch].adv, k);
const glyphD = (ch, k, size) => {
  const a = G.w62[ch].loops, b = G.w125[ch].loops, s = size / UPM; let d = '';
  for (let i = 0; i < a.length; i++) { const la = a[i], lb = b[i]; d += 'M'; for (let j = 0; j < la.length; j += 2) d += (j ? 'L' : '') + f1(lerp(la[j], lb[j], k) * s) + ' ' + f1(-lerp(la[j + 1], lb[j + 1], k) * s); d += 'Z'; }
  return d;
};
const layoutWord = (word, ks, size, track) => { const s = size / UPM; let x = 0; const xs = []; for (let i = 0; i < word.length; i++) { xs.push(x); x += (glyphAdv(word[i], ks[i]) + track) * s; } return { xs, total: x - track * s }; };
const IB = (() => { const bb = (l) => { const xs = l.filter((_, j) => j % 2 === 0), ys = l.filter((_, j) => j % 2 === 1); return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)]; }; return { a: bb(G.w62.I.loops[0]), b: bb(G.w125.I.loops[0]) }; })();  // the I is a plain rectangle
const fitSize = (word, track, maxW, maxSize) => { let u = 0; for (let i = 0; i < word.length; i++) u += G.w125[word[i]].adv + track; return Math.min(maxSize, maxW * UPM / (u - track)); };

/* ───────────── the wordmark: DAR.COM (frame 0 = last frame) ───────────── */
const KS = 235, ks = KS / UPM, KL = ['D', 'A', 'R', '.', 'C', 'O', 'M'], CAPK = G.capK;
const KADV = KL.map((c) => G.wK[c].adv);
let acc = 0; const KXU = KADV.map((a) => { const x = acc; acc += a; return x; }); const KWU = acc;
const KX0 = (W - KWU * ks) / 2, KBASE = 520 + CAPK * ks / 2, kx = (i) => KX0 + KXU[i] * ks;
const DOT = (() => {                                              // the period of DAR.COM is a perfect circle: it is the door
  const L = G.wK['.'].loops[0], xs = L.filter((_, j) => j % 2 === 0), ys = L.filter((_, j) => j % 2 === 1);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  return { c: [kx(3) + (x0 + x1) / 2 * ks, KBASE - (y0 + y1) / 2 * ks], r: (x1 - x0) / 2 * ks };
})();
const DOT_C = DOT.c, DOT_R = DOT.r, DOT_RP = DOT_R * 2.2;
const TAG_Y = KBASE + 118, TAG = 'MAISON DE COMMUNICATION', TAG_W = KWU * ks * 1.22;
const loopsD = (loops, size) => { const s = size / UPM; let d = ''; for (const l of loops) { d += 'M'; for (let j = 0; j < l.length; j += 2) d += (j ? 'L' : '') + f1(l[j] * s) + ' ' + f1(-l[j + 1] * s); d += 'Z'; } return d; };
const wkD = (ch, size) => loopsD(G.wK[ch].loops, size);
const tagEl = (parent) => { const e = S('text', { x: f1((W - TAG_W) / 2), y: TAG_Y, textLength: f1(TAG_W), lengthAdjust: 'spacing', fill: rgb(COL.K), style: type(500, 100, 'font-size:44px') }, parent); e.textContent = TAG; return e; };

/* ───────────── layers, in time order ───────────── */
const LH = mkLayer(), LK = mkLayer(), LM = mkLayer(), LHS = mkLayer(), LUI = mkLayer(false), LST = mkLayer(false), LF = mkLayer();

/* ===================== 1 · HOOK  (0 – 2 s) ===================== */
const hk = {};
S('rect', { width: W, height: H, fill: rgb(COL.CR) }, LH.s);
hk.letters = KL.map((ch) => (ch === '.' ? null : S('path', { d: wkD(ch, KS), fill: rgb(COL.K) }, LH.s)));
hk.blur = KL.map(() => mkBlur());
hk.disc = S('circle', { cx: DOT_C[0], cy: DOT_C[1], r: DOT_R, fill: rgb(COL.K) }, LH.s);
hk.ring = S('circle', { cx: W / 2, cy: H / 2, fill: 'none', stroke: rgb(COL.K), 'stroke-width': 22 }, LH.s);
hk.dot = S('circle', { cx: W / 2, cy: H / 2, fill: rgb(COL.K) }, LH.s);
hk.tag = tagEl(LH.s); hk.blurTag = mkBlur(500);
const HK_LEFT = [720, 940, 1160], HK_RIGHT = [1250, 1150, 1050];
const hkOff = (i, t) => (i < 3 ? -HK_LEFT[i] : HK_RIGHT[i - 4]) * sp(P(t, 0.02 * i, 0.46), 8);
function hook(t) {
  KL.forEach((ch, i) => {
    if (ch === '.') return;
    const el = hk.letters[i], x = kx(i) + hkOff(i, t);
    el.setAttribute('transform', `translate(${f1(x)} ${f1(KBASE)})`);
    const v = vel((tt) => [hkOff(i, tt), 0], t); setBlur(hk.blur[i], el, v[0], 0);
  });
  hk.tag.setAttribute('y', f1(TAG_Y + 520 * sp(P(t, 0, 0.4), 8)));
  { const v = vel((tt) => [0, 520 * sp(P(tt, 0, 0.4), 8)], t); setBlur(hk.blurTag, hk.tag, 0, v[1]); }
  hk.disc.setAttribute('fill', rgb(t < 0.0083 ? COL.K : COL.V));        // the dot turns vermilion on the very first beat
  let r; if (t < 0.5) r = DOT_R * (1 + 1.2 * sp(P(t, 0, 0.5), 9)); else r = DOT_RP * Math.exp(Math.log(1650 / DOT_RP) * sp(P(t, 0.5, 0.5), 7));
  hk.disc.setAttribute('r', f1(r));
  const ringOn = t >= 1.0 && t < 1.55; hk.ring.style.display = ringOn ? '' : 'none';
  if (ringOn) hk.ring.setAttribute('r', f1(8 + 1250 * sp(P(t, 1.0, 0.5), 5)));
  const rd = t < 1.5 ? 70 * sp(P(t, 1.0, 0.45), 9) : 70 * Math.exp(Math.log(1300 / 70) * sp(P(t, 1.5, 0.5), 7));
  hk.dot.style.display = t >= 1.0 ? '' : 'none'; hk.dot.setAttribute('r', f1(rd));
}

/* ===================== 2 · KINETIC TYPE  (2 – 4 s) ===================== */
const kn = {}; kn.bg = S('rect', { width: W, height: H, fill: rgb(COL.K) }, LK.s);
const mkWord = (word, parent, fill) => word.split('').map((ch) => S('path', { fill }, parent));
const WSPEC = { BRAND: 'V', SHOOT: 'CR', POST: 'V', BUILD: 'CR' }, KTRACK = -22;
const wsize = {}; Object.keys(WSPEC).forEach((w) => { wsize[w] = fitSize(w, KTRACK, 1640, 560); });
const capPx = (w) => CAP * wsize[w] / UPM, baseOf = (w) => H / 2 + capPx(w) / 2;
const paintWord = (paths, word, ks_, dy, cx) => {
  const lay = layoutWord(word, ks_, wsize[word], KTRACK), x0 = cx - lay.total / 2, base = baseOf(word);
  word.split('').forEach((ch, i) => { paths[i].setAttribute('d', glyphD(ch, ks_[i], wsize[word])); paths[i].setAttribute('transform', `translate(${f1(x0 + lay.xs[i])} ${f1(base + dy[i])})`); });
  return { lay, x0 };
};
// BRAND — rises out of a mask, width 62 → 125
const clipBrand = S('clipPath', { id: 'cBrand' }, LK.s); kn.clipBrandR = S('rect', { x: 0, width: W }, clipBrand);
kn.gBrandO = S('g', {}, LK.s); kn.gBrand = S('g', {}, kn.gBrandO); kn.pBrand = mkWord('BRAND', kn.gBrand, rgb(COL.V)); kn.bBrand = mkBlur();
// SHOOT — splits in: top half from the left, bottom half from the right
const clipTop = S('clipPath', { id: 'cTop' }, LK.s), clipBot = S('clipPath', { id: 'cBot' }, LK.s); kn.clipTopR = S('rect', { x: 0, y: 0, width: W }, clipTop); kn.clipBotR = S('rect', { x: 0, width: W }, clipBot);
kn.gTopO = S('g', { 'clip-path': 'url(#cTop)' }, LK.s); kn.gTop = S('g', {}, kn.gTopO); kn.pTop = mkWord('SHOOT', kn.gTop, rgb(COL.CR));
kn.gBotO = S('g', { 'clip-path': 'url(#cBot)' }, LK.s); kn.gBot = S('g', {}, kn.gBotO); kn.pBot = mkWord('SHOOT', kn.gBot, rgb(COL.CR)); kn.bTop = mkBlur(); kn.bBot = mkBlur();
// POST — zooms through from 3.4×
kn.gPost = S('g', {}, LK.s); kn.pPost = mkWord('POST', kn.gPost, rgb(COL.V)); kn.bPost = mkBlur();
// BUILD — drops in; its cobalt I stretches into the next ground
kn.gBuild = S('g', {}, LK.s); kn.pBuild = mkWord('BUILD', kn.gBuild, rgb(COL.CR)); kn.pBuild[2].setAttribute('fill', rgb(COL.B)); kn.bBuild = mkBlur();
kn.flood = S('rect', { fill: rgb(COL.B) }, LK.s);
const brandY = (i, t) => (1 - sp(P(t, 2.0 + 0.045 * i, 0.42), 9)) * capPx('BRAND') * 1.3;
const brandEx = (t) => -(baseOf('BRAND') + 300) * sp(P(t, 2.5, 0.34), 10);
const shootX = (t) => { const a = 1920 * (1 - sp(P(t, 2.5, 0.4), 8)), b = 1920 * sp(P(t, 3.0, 0.32), 10); return [-a + b, a - b]; };
const postS = (t) => Math.exp(Math.log(3.4) * (1 - sp(P(t, 3.0, 0.45), 9)) + Math.log(9) * sp(P(t, 3.5, 0.3), 9));
function kinetic(t) {
  const vis = (el, on) => { el.style.display = on ? '' : 'none'; };
  // BRAND
  const onB = t < 2.9; vis(kn.gBrandO, onB);
  if (onB) {
    const ksB = [0, 1, 2, 3, 4].map((i) => sp(P(t, 2.0 + 0.045 * i, 0.42), 9)), dyB = [0, 1, 2, 3, 4].map((i) => brandY(i, t));
    paintWord(kn.pBrand, 'BRAND', ksB, dyB, W / 2);
    kn.gBrand.setAttribute('transform', `translate(0 ${f1(brandEx(t))})`);
    if (t < 2.5) { kn.gBrandO.setAttribute('clip-path', 'url(#cBrand)'); kn.clipBrandR.setAttribute('y', f1(baseOf('BRAND') - capPx('BRAND') - 6)); kn.clipBrandR.setAttribute('height', f1(capPx('BRAND') + 12)); } else kn.gBrandO.removeAttribute('clip-path');
    const v = vel((tt) => [0, brandY(2, tt) + brandEx(tt)], t); setBlur(kn.bBrand, kn.gBrandO, 0, v[1]);
  }
  // SHOOT
  const onS = t >= 2.5 && t < 3.4; vis(kn.gTopO, onS); vis(kn.gBotO, onS);
  if (onS) {
    const mid = Math.round(baseOf('SHOOT') - capPx('SHOOT') / 2), ones = [1, 1, 1, 1, 1], zero = [0, 0, 0, 0, 0];
    kn.clipTopR.setAttribute('height', mid); kn.clipBotR.setAttribute('y', mid); kn.clipBotR.setAttribute('height', H - mid);
    paintWord(kn.pTop, 'SHOOT', ones, zero, W / 2); paintWord(kn.pBot, 'SHOOT', ones, zero, W / 2);
    const x = shootX(t); kn.gTop.setAttribute('transform', `translate(${f1(x[0])} 0)`); kn.gBot.setAttribute('transform', `translate(${f1(x[1])} 0)`);
    const v = vel((tt) => [shootX(tt)[0], 0], t), v2 = vel((tt) => [shootX(tt)[1], 0], t); setBlur(kn.bTop, kn.gTopO, v[0], 0); setBlur(kn.bBot, kn.gBotO, v2[0], 0);
  }
  // POST
  const onP = t >= 3.0 && t < 3.85; vis(kn.gPost, onP);
  if (onP) {
    paintWord(kn.pPost, 'POST', [1, 1, 1, 1], [0, 0, 0, 0], W / 2);
    const s = postS(t); kn.gPost.setAttribute('transform', `translate(${W / 2} ${H / 2}) scale(${s.toFixed(4)}) translate(${-W / 2} ${-H / 2})`);
    const ds = (postS(t + 0.01) - postS(t - 0.01)) / 0.02 / s; setBlur(kn.bPost, kn.gPost, ds * 220, ds * 220);
  }
  // BUILD + the flood
  const onU = t >= 3.5; vis(kn.gBuild, onU); vis(kn.flood, onU && t >= 3.72);
  if (onU) {
    const ksU = [0, 1, 2, 3, 4].map((i) => sp(P(t, 3.5 + 0.02 * i, 0.26), 9)), dyU = ksU.map((k) => -(1 - k) * capPx('BUILD') * 1.7);
    const { lay, x0 } = paintWord(kn.pBuild, 'BUILD', ksU, dyU, W / 2);
    const v = vel((tt) => [0, -(1 - sp(P(tt, 3.54, 0.26), 9)) * capPx('BUILD') * 1.7], t); setBlur(kn.bBuild, kn.gBuild, 0, v[1]);
    if (t >= 3.72) {                                          // the I (a plain rectangle) swallows the frame
      const s = wsize.BUILD / UPM, kI = ksU[2], bx0 = lerp(IB.a[0], IB.b[0], kI), bx1 = lerp(IB.a[2], IB.b[2], kI), ix = x0 + lay.xs[2] + bx0 * s, iw = (bx1 - bx0) * s, ih = CAP * s, iy = baseOf('BUILD') + dyU[2] - ih;
      kn.pBuild[2].style.display = 'none';
      const e1 = sp(P(t, 3.72, 0.14), 9), e2 = sp(P(t, 3.8, 0.2), 8);       // the I first stretches into a column, then sweeps sideways
      kn.flood.setAttribute('x', f1(lerp(ix, 0, e2))); kn.flood.setAttribute('y', f1(lerp(iy, 0, e1))); kn.flood.setAttribute('width', f1(lerp(iw, W, e2))); kn.flood.setAttribute('height', f1(lerp(ih, H, e1)));
    } else kn.pBuild[2].style.display = '';
  }
}

/* ===================== 3 · SHAPE MORPH  (4 – 6 s) ===================== */
const mo = {}; S('rect', { width: W, height: H, fill: rgb(COL.B) }, LM.s);
const circP = (r) => Array.from({ length: 96 }, (_, i) => [Math.cos(i / 96 * 2 * Math.PI) * r, Math.sin(i / 96 * 2 * Math.PI) * r]);
const rectP = (w, h) => [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]];
const triP = (w, h) => [[0, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]];
const archP = (w, h) => { const r = w / 2, cy = -h / 2 + r, p = [[-r, h / 2], [r, h / 2], [r, cy]]; for (let i = 1; i < 24; i++) { const a = i / 24 * Math.PI; p.push([r * Math.cos(a), cy - r * Math.sin(a)]); } p.push([-r, cy]); p.corner = [0, 1, 2, p.length - 1]; return p; };
const SHP = {
  A: [circP(140), rectP(280, 280), triP(340, 300), triP(640, 230)],
  B: [circP(140), triP(340, 300), archP(220, 330), archP(150, 230)],
  C: [circP(140), archP(220, 330), rectP(280, 280), rectP(520, 340)],

const HOUSE = { body: [960, 650], roof: [960, 365], door: [960, 705] };           // house elevation (centres), shared with the 3D scene
const SLOT = { A: [[520, 540], [520, 540], [520, 540], HOUSE.roof], B: [[960, 540], [960, 540], [960, 540], HOUSE.door], C: [[1400, 540], [1400, 540], [1400, 540], HOUSE.body] };
const SCOL = { A: ['V', 'CR', 'V', 'V'], B: ['CR', 'V', 'K', 'K'], C: ['K', 'K', 'CR', 'CR'] };
const ROT = { A: [0, -32, 32, -20], B: [0, 32, -32, 20], C: [0, -32, 32, -14] };
const rayHit = (poly, a) => { const dx = Math.cos(a), dy = Math.sin(a); let best = Infinity; for (let i = 0; i < poly.length; i++) { const p = poly[i], q = poly[(i + 1) % poly.length], ex = q[0] - p[0], ey = q[1] - p[1], den = dx * ey - dy * ex; if (Math.abs(den) < 1e-9) continue; const tt = (p[0] * ey - p[1] * ex) / den, uu = (p[0] * dy - p[1] * dx) / den; if (tt > 1e-6 && uu >= -1e-9 && uu <= 1 + 1e-9 && tt < best) best = tt; } return best; };
const ANG = (() => {                                            // a dense uniform fan of angles + the exact corners (the arcs need no extra samples)
  const set = []; for (let i = 0; i < 720; i++) set.push(i / 720 * 2 * Math.PI - Math.PI);
  Object.values(SHP).flat().forEach((poly) => { const idx = poly.corner || (poly.length < 10 ? poly.map((_, i) => i) : []); idx.forEach((i) => set.push(Math.atan2(poly[i][1], poly[i][0]))); });
  set.sort((x, y) => x - y); const out = [set[0]]; for (let i = 1; i < set.length; i++) if (set[i] - out[out.length - 1] > 1e-7) out.push(set[i]); return out;
})();
const RAD = {}; Object.keys(SHP).forEach((k) => { RAD[k] = SHP[k].map((poly) => ANG.map((a) => rayHit(poly, a))); });
// body first, so the door sits on top of it
mo.paths = {}; ['C', 'A', 'B'].forEach((k) => { mo.paths[k] = S('path', {}, LM.s); });
mo.blur = { A: mkBlur(), B: mkBlur(), C: mkBlur() };
function morphState(k, t) {
  const w = [1, 2, 3].map((m) => sp(P(t, 4.0 + 0.5 * m, 0.42), 9)), u = w[0] + w[1] + w[2], i0 = Math.min(2, Math.floor(u + 1e-9)), fr = clamp(u - i0);
  const m = i0 + 1, wm = w[m - 1], rotA = deg(ROT[k][m]) * (1 - wm);
