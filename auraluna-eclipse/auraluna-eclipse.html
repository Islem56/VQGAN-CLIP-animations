const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

const f1 = (n) => Math.round(n * 10) / 10, f2 = (n) => Math.round(n * 100) / 100, f3 = (n) => Math.round(n * 1000) / 1000;

const sp = (p, w = 11) => { const f = (x) => 1 - (1 + w * x) * Math.exp(-w * x); return f(p) / f(1); };   // critically damped spring
const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
