<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>AURA LUNA — L'Instant</title>
<meta name="viewport" content="width=1920, height=1080">
<style>
@font-face{font-family:"Montserrat";src:url(data:font/woff2;base64,__FONT_B64__) format("woff2");font-weight:100 900;font-display:block}
html,body{margin:0;background:#02060E;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#02060E;font-family:"Montserrat",sans-serif;-webkit-font-smoothing:antialiased}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;display:none}
.layer>svg{position:absolute;left:0;top:0}
.screen{mix-blend-mode:screen}
</style>
</head>
<body>
<div id="stage"></div>
<svg id="defs" width="0" height="0" style="position:absolute"></svg>
<script>
/* AURA LUNA — "L'INSTANT" · 17.5 s · 96 BPM · 1920x1080
   « L'instant où une idée devient image. » The film starts on the lock-up, which falls back into the spark between a
   human hand and a digital one; the spark ignites, floods the frame and becomes the studio's three crafts; a grid of
   moon phases spells the mark's modules from Nuit to Halo; the last moon becomes a lit sphere and passes through an
   eclipse; its light becomes the paper of the brand guidelines; the Cosmos swatch becomes the night the mark is rebuilt
   in. The last frame is the first frame. A lunar calendar runs in the corners, like the footers of the guidelines.
   Everything on screen is a pure function of time: window.seek(t). No CSS animations, no timers, no state between frames.
   Brand: the Aura Luna palette (Cosmos → Halo, neutrals, Éclipse < 5 %), its light effects (Halo, Éclipse, the main
   gradient), Montserrat, and the Asik wordmark traced from the official lock-up. */
(() => {
'use strict';
const G = __GLYPHS__, MONO = __MONO__, WM = __WORDMARK__, HANDS = { human: '__HAND_HUMAN__', robot: '__HAND_ROBOT__' };
const W = 1920, H = 1080, BEAT = 0.625, DUR = 17.5, UPM = G.upm, CAP = G.capH;
window.DUR = DUR;

/* ───────────── maths · colour · easing ───────────── */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const f1 = (n) => Math.round(n * 10) / 10, f2 = (n) => Math.round(n * 100) / 100;
const P = (t, t0, d) => clamp((t - t0) / d);
const eo = (p, k = 6) => (1 - Math.exp(-k * p)) / (1 - Math.exp(-k));
const ei = (p, k = 5) => (Math.exp(k * p) - 1) / (Math.exp(k) - 1);
const sp = (p, w = 11) => { const f = (x) => 1 - (1 + w * x) * Math.exp(-w * x); return f(p) / f(1); };   // critically damped spring
const kf = (t, keys, w = 8) => {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) return lerp(keys[i - 1][1], keys[i][1], sp(P(t, keys[i - 1][0], keys[i][0] - keys[i - 1][0]), w));
  return keys[keys.length - 1][1];
};
const deg = (d) => d * Math.PI / 180;
/* the brand palette (guidelines, 04 · Couleurs) */
const C = {
  COSMOS: '#02060E', NUIT: '#1F0533', ORBITE: '#3C0557', AURA: '#59047C', LUNA: '#7604A0', HALO: '#9303C5',
  BLANC: '#FFFFFF', LUNAIRE: '#F4F1F7', BRUME: '#E2D3EC', ARDOISE: '#6E6A75', ECLIPSE: '#D53207',
};

/* ───────────── dom helpers ───────────── */
const NS = 'http://www.w3.org/2000/svg';
const S = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const stage = document.getElementById('stage'), defs = document.getElementById('defs');
const mkLayer = () => { const d = document.createElement('div'); d.className = 'layer'; stage.appendChild(d); const s = S('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` }, d); return { d, s }; };
const show = (L, on) => { const v = on ? 'block' : 'none'; if (L.d.style.display !== v) L.d.style.display = v; };
const vis = (el, on) => { const v = on ? '' : 'none'; if (el.style.display !== v) el.style.display = v; };
const type = (w, size, ls = 0) => `font-family:Montserrat,sans-serif;font-weight:${w};font-variation-settings:'wght' ${w};font-size:${size}px;letter-spacing:${ls}px`;
const txt = (parent, x, y, s, style, fill, anchor = 'start') => { const e = S('text', { x, y, fill, 'text-anchor': anchor, style }, parent); e.textContent = s; return e; };
const tf = (el, s) => el.setAttribute('transform', s);
const around = (c, k) => `translate(${f1(c[0])} ${f1(c[1])}) scale(${k.toFixed(4)}) translate(${f1(-c[0])} ${f1(-c[1])})`;
let gid = 0;
const radial = (stops) => { const id = 'g' + gid++; const g = S('radialGradient', { id, cx: '50%', cy: '50%', r: '50%' }, defs); stops.forEach(([o, c, a]) => S('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, g)); return `url(#${id})`; };
const linear = (stops, x2 = '100%', y2 = '0%') => { const id = 'g' + gid++; const g = S('linearGradient', { id, x1: '0%', y1: '0%', x2, y2 }, defs); stops.forEach(([o, c, a]) => S('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, g)); return `url(#${id})`; };
/* the brand's light effects */
const HALO_FILL = radial([['0%', C.HALO, 0.7], ['100%', C.HALO, 0]]);                                   // « Halo 70 % → 0 %, dégradé radial »
const CORE_FILL = radial([['0%', C.BLANC, 1], ['16%', C.BRUME, 0.95], ['42%', C.HALO, 0.6], ['100%', C.HALO, 0]]);
const STREAK_FILL = linear([['0%', C.HALO, 0], ['42%', C.BRUME, 0.55], ['50%', C.BLANC, 1], ['58%', C.BRUME, 0.55], ['100%', C.HALO, 0]]);

/* motion blur that follows speed and direction */
const BLUR_K = 0.0042, BLUR_MAX = 46, blurs = [];
const mkBlur = (r = 30) => { const f = S('filter', { id: 'mb' + blurs.length, x: `-${r}%`, y: `-${r}%`, width: `${100 + 2 * r}%`, height: `${100 + 2 * r}%`, 'color-interpolation-filters': 'sRGB' }, defs); blurs.push(S('feGaussianBlur', { stdDeviation: '0 0' }, f)); return blurs.length - 1; };
const setBlur = (i, el, vx, vy) => {
  const sx = Math.min(BLUR_MAX, Math.abs(vx) * BLUR_K), sy = Math.min(BLUR_MAX, Math.abs(vy) * BLUR_K);
  if (sx + sy < 0.4) { if (el.style.filter) el.style.filter = ''; return; }
  blurs[i].setAttribute('stdDeviation', `${f2(sx)} ${f2(sy)}`); el.style.filter = `url(#mb${i})`;
};
const vel = (fn, t) => { const d = 1 / 75, a = fn(t - d), b = fn(t); return [(b[0] - a[0]) / d, (b[1] - a[1]) / d]; };

/* ───────────── shapes ───────────── */
const pairs = (fl) => { const o = []; for (let i = 0; i < fl.length; i += 2) o.push([fl[i], fl[i + 1]]); return o; };
const ptsD = (pts, map) => 'M' + pts.map((p) => { const q = map(p); return f1(q[0]) + ' ' + f1(q[1]); }).join('L') + 'Z';
const rotAbout = (p, c, a) => { const ca = Math.cos(a), sa = Math.sin(a), x = p[0] - c[0], y = p[1] - c[1]; return [c[0] + x * ca - y * sa, c[1] + x * sa + y * ca]; };
const circleD = (cx, cy, r, n = 96) => { let d = ''; for (let i = 0; i < n; i++) { const a = i / n * 2 * Math.PI; d += (i ? 'L' : 'M') + f1(cx + r * Math.cos(a)) + ' ' + f1(cy + r * Math.sin(a)); } return d + 'Z'; };
const phaseD = (cx, cy, R, k, n = 48) => {             // the lit part of a disc, lit from the right: k = −1 full … 1 new
  let d = '';
  for (let i = 0; i <= n; i++) { const a = -Math.PI / 2 + Math.PI * i / n; d += (i ? 'L' : 'M') + f1(cx + R * Math.cos(a)) + ' ' + f1(cy + R * Math.sin(a)); }
  for (let i = n; i >= 0; i--) { const a = -Math.PI / 2 + Math.PI * i / n; d += 'L' + f1(cx + k * R * Math.cos(a)) + ' ' + f1(cy + R * Math.sin(a)); }
  return d + 'Z';
};
/* Montserrat outlines (wght 200 → 800) */
const glyphAdv = (ch, k) => lerp(G.thin[ch].adv, G.bold[ch].adv, k);
const glyphD = (ch, k, size) => {
  const a = G.thin[ch].loops, b = G.bold[ch].loops, s = size / UPM; let d = '';
  for (let i = 0; i < a.length; i++) { const la = a[i], lb = b[i]; d += 'M'; for (let j = 0; j < la.length; j += 2) d += (j ? 'L' : '') + f1(lerp(la[j], lb[j], k) * s) + ' ' + f1(-lerp(la[j + 1], lb[j + 1], k) * s); d += 'Z'; }
  return d;
};

/* ───────────── the official lock-up (measured on the logo file; placed in the frame by LK) ─────────────
   mark x 259–841 · y 276–548 | wordmark (Asik, traced) y 607–679 | descriptor y 714–738 | signature y 773–793 / 805–824 */
const LKS = 0.92, LKC = [550, 550], LK = (p) => [W / 2 + (p[0] - LKC[0]) * LKS, H / 2 + (p[1] - LKC[1]) * LKS];
const MOD = {}; for (const k in MONO.modules) MOD[k] = { pts: pairs(MONO.modules[k].loop), c: MONO.modules[k].c };
const MK = ['At', 'Ab', 'S', 'B', 'C', 'D'];
const MONO_TO_LOCK = (p) => [259 + p[0] * (582 / MONO.w), 276 + p[1] * (272 / MONO.h)];
const markMap = (p) => LK(MONO_TO_LOCK(p));
const UNION_D = MONO.union.map((l) => ptsD(pairs(l), markMap)).join('');
const MARK_C = LK([550, 412]);
const WM_LETTERS = WM.letters.map((L) => ({ d: L.loops.map((l) => ptsD(pairs(l), LK)).join(''), cx: LK([(L.x0 + L.x1) / 2, 643])[0] }));
const WB = LK([0, 679])[1];
const DESC = { y: LK([0, 738])[1], x0: LK([170, 0])[0], w: 760 * LKS, size: 34 * LKS };
const SIG = [{ y: LK([0, 793])[1], x0: LK([254, 0])[0], w: 592 * LKS }, { y: LK([0, 824])[1], x0: LK([293, 0])[0], w: 524 * LKS }], SIG_SIZE = 28 * LKS;

function lockup(L, id) {
  const o = {};
  o.bg = S('rect', { width: W, height: H, fill: C.COSMOS }, L.s);
  o.halo = S('circle', { cx: f1(MARK_C[0]), cy: f1(MARK_C[1]), fill: HALO_FILL }, L.s);
  o.g = S('g', {}, L.s);
  o.union = S('path', { d: UNION_D, fill: C.BLANC }, o.g);
  o.mods = MK.map(() => S('path', { fill: C.BLANC, stroke: C.BLANC, 'stroke-width': 1.1, 'stroke-linejoin': 'round' }, o.g)); o.mblur = MK.map(() => mkBlur());
  const cw = S('clipPath', { id: 'cw' + id }, L.s); S('rect', { x: 0, y: 0, width: W, height: WB + 1.5 }, cw);
  o.wg = S('g', { 'clip-path': `url(#cw${id})` }, o.g);
  o.letters = WM_LETTERS.map((L_) => S('path', { d: L_.d, fill: C.BLANC }, o.wg));
  const cd = S('clipPath', { id: 'cd' + id }, L.s); o.dclip = S('rect', { x: 0, y: DESC.y - 40, width: W, height: 48 }, cd);
  o.dg = S('g', { 'clip-path': `url(#cd${id})` }, o.g);
  o.desc = S('text', { x: f1(DESC.x0), y: f1(DESC.y), textLength: f1(DESC.w), lengthAdjust: 'spacing', fill: C.BRUME, style: type(500, DESC.size) }, o.dg);
  ['DIGITAL ', '. ', 'DESIGN ', '. ', 'PRODUCTION'].forEach((s, i) => { const t = S('tspan', { fill: i % 2 ? C.ECLIPSE : C.BRUME }, o.desc); t.textContent = s; });
  const cs = S('clipPath', { id: 'cs' + id }, L.s); o.sclip = S('rect', { x: 0, y: SIG[0].y - 30, height: 70 }, cs);
  o.sig = ['WHERE HUMAN IMAGINATION', 'MEETS DIGITAL CREATION'].map((s, i) => { const e = S('text', { x: f1(SIG[i].x0), y: f1(SIG[i].y), textLength: f1(SIG[i].w), lengthAdjust: 'spacing', fill: C.ARDOISE, style: type(600, SIG_SIZE), 'clip-path': `url(#cs${id})` }, o.g); e.textContent = s; return e; });
  return o;
}
// wordDrop(i): how far letter i has sunk under the wordmark's baseline · descRise: 0…1 · sigOpen: 0…1 · halo: 0…1
function paintLockup(o, { wordDrop, descRise, sigOpen, halo }) {
  o.halo.setAttribute('r', f1(760 * halo)); vis(o.halo, halo > 0.002);
  o.letters.forEach((el, i) => tf(el, `translate(0 ${f1(wordDrop(i))})`));
  tf(o.desc, `translate(0 ${f1(44 * (1 - descRise))})`);
  const half = SIG[0].w / 2 * sigOpen + 1; o.sclip.setAttribute('x', f1(W / 2 - half)); o.sclip.setAttribute('width', f1(2 * half)); o.sig.forEach((e) => vis(e, sigOpen > 0.002));
}

/* ───────────── layers, in time order (+ the lunar calendar on top) ───────────── */
const L1 = mkLayer(), L3 = mkLayer(), L4 = mkLayer(), L5 = mkLayer(), L6 = mkLayer(), L7 = mkLayer(), LHUD = mkLayer();

/* ===================== 1 + 2 · L'IDÉE → L'INSTANT  (0 – 5 s) ===================== */
const SPARK = [W / 2, H / 2], TIP_SRC = [960.5, 708];                    // the spark sits between the fingertips of the key visual
const h1 = lockup(L1, '1');
h1.night = S('g', {}, L1.s);
h1.stars = S('g', {}, h1.night);
let seed = 7; const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
for (let i = 0; i < 170; i++) { const x = rnd() * W, y = rnd() * H, r = 0.5 + rnd() * rnd() * 1.6; S('circle', { cx: f1(x), cy: f1(y), r: f2(r), fill: rnd() < 0.25 ? C.BRUME : C.BLANC, opacity: f2(0.25 + rnd() * 0.6) }, h1.stars); }
h1.cam = S('g', {}, h1.night);
h1.sHalo = S('circle', { fill: HALO_FILL }, h1.cam);
const handImg = (key, box) => S('image', { href: 'data:image/jpeg;base64,' + HANDS[key], x: box[0] - TIP_SRC[0] + SPARK[0], y: box[1] - TIP_SRC[1] + SPARK[1], width: box[2], height: box[3] }, h1.cam);
h1.hg = S('g', { class: 'screen' }, h1.cam); h1.rg = S('g', { class: 'screen' }, h1.cam);   // screen: the black around each hand disappears (on the group, so it survives the motion blur)
h1.human = handImg('human', [0, 432, 804, 460]); h1.hg.appendChild(h1.human); h1.hblur = mkBlur(10);
h1.robot = handImg('robot', [1128, 456, 792, 460]); h1.rg.appendChild(h1.robot); h1.rblur = mkBlur(10);
h1.ring = S('circle', { cx: SPARK[0], cy: SPARK[1], fill: 'none', stroke: C.HALO, 'stroke-width': 2.5 }, h1.cam);
h1.streak = S('ellipse', { cx: SPARK[0], cy: SPARK[1], fill: STREAK_FILL }, h1.cam);
h1.core = S('circle', { cx: SPARK[0], cy: SPARK[1], fill: CORE_FILL }, h1.cam);
h1.dot = S('circle', { cx: SPARK[0], cy: SPARK[1], fill: C.BLANC }, h1.cam);
h1.flood = S('circle', { cx: SPARK[0], cy: SPARK[1], fill: C.LUNA }, h1.cam); h1.floodHalo = S('circle', { cx: SPARK[0], cy: SPARK[1], fill: HALO_FILL }, h1.cam);
h1.cam.insertBefore(h1.floodHalo, h1.flood);
// the concept line, word group by word group, one per beat
const CONCEPT = [["L'INSTANT", 2.5], ['OÙ UNE IDÉE', 3.125], ['DEVIENT', 3.75], ['IMAGE', 4.375]], CY = 880;
const cc = S('clipPath', { id: 'cConcept' }, L1.s); S('rect', { x: 0, y: CY - 40, width: W, height: 50 }, cc);
h1.cg = S('g', { 'clip-path': 'url(#cConcept)' }); L1.s.insertBefore(h1.cg, h1.night);   // under the night: the flood swallows the line
h1.words = CONCEPT.map(([s]) => txt(h1.cg, 0, CY, s, type(500, 27, 8.6), C.BLANC));
h1.period = txt(h1.cg, 0, CY, '.', type(700, 27, 0), C.ECLIPSE);
let conceptLaid = false;
const layConcept = () => {
  const gap = 26, ws = h1.words.map((e) => e.getComputedTextLength()), pw = h1.period.getComputedTextLength();
  const total = ws.reduce((a, b) => a + b, 0) + gap * (ws.length - 1) + pw - 8.6; let x = W / 2 - total / 2;
  h1.words.forEach((e, i) => { e.setAttribute('x', f1(x)); x += ws[i] + gap; });
  h1.period.setAttribute('x', f1(x - gap - 8.6)); conceptLaid = true;
};
const lkImplode = (t) => 1 - ei(P(t, 0.05, 0.52), 3.2);                  // the lock-up falls into the spark
const handIn = (t, t0) => 1 - sp(P(t, t0, 1.3), 7);
const camZoom = (t) => 1 + 0.12 * eo(P(t, 0.6, 4.4), 2.4);
const reach = (t) => sp(P(t, 4.2, 0.4), 9);                              // the fingers close in on « IMAGE »
const sparkK = (t) => kf(t, [[0.5, 0], [0.64, 1.9], [1.15, 1], [1.25, 1], [1.4, 1.18], [1.875, 1.06], [2.0, 1.26], [2.5, 1.2], [2.62, 1.45], [3.125, 1.4], [3.24, 1.7], [3.75, 1.65], [3.86, 2.0], [4.375, 2.0], [4.46, 3.4]], 8);
function opening(t) {
  // the lock-up (frame 0) falls into the spark
  const k = lkImplode(t), lockOn = t < 0.58;
  vis(h1.g, lockOn);
  if (lockOn) {
    tf(h1.g, around(SPARK, Math.max(0.0005, k)));
    paintLockup(h1, { wordDrop: () => 0, descRise: 1, sigOpen: 1, halo: k });
    MK.forEach((_, i) => vis(h1.mods[i], false)); vis(h1.union, true);
    const dk = (lkImplode(t) - lkImplode(t - 1 / 75)) * 75; setBlur(h1.mblur[0], h1.g, dk * 220, dk * 220);
  } else { vis(h1.halo, false); setBlur(h1.mblur[0], h1.g, 0, 0); }
  // the night, the hands, the spark
  const night = t >= 0.5; vis(h1.night, night); vis(h1.cg, t >= 2.4);
  if (!night) return;
  const z = camZoom(t); tf(h1.cam, around(SPARK, z)); tf(h1.stars, around(SPARK, 1 + (z - 1) * 0.45));
  const hx = (tt) => -860 * handIn(tt, 0.7) - 0 + 118 * reach(tt), rx = (tt) => 860 * handIn(tt, 0.86) - 118 * reach(tt);
  tf(h1.hg, `translate(${f1(hx(t))} 0)`); tf(h1.rg, `translate(${f1(rx(t))} 0)`);
  { const v = vel((tt) => [hx(tt), 0], t); setBlur(h1.hblur, h1.hg, v[0], 0); const v2 = vel((tt) => [rx(tt), 0], t); setBlur(h1.rblur, h1.rg, v2[0], 0); }
  const s = sparkK(t), on = t >= 0.52;
  [h1.core, h1.dot, h1.streak, h1.sHalo].forEach((e) => vis(e, on));
  h1.core.setAttribute('r', f1(64 * s)); h1.dot.setAttribute('r', f2(3.2 + 1.2 * s));
  h1.streak.setAttribute('rx', f1(170 * s + 60)); h1.streak.setAttribute('ry', f2(1.6 + 0.5 * s));
  h1.sHalo.setAttribute('cx', SPARK[0]); h1.sHalo.setAttribute('cy', SPARK[1]); h1.sHalo.setAttribute('r', f1(260 * s));
  // the Éclipse ring on « DEVIENT »
  const rq = P(t, 3.75, 0.9); vis(h1.ring, rq > 0 && rq < 1);
  if (rq > 0 && rq < 1) { h1.ring.setAttribute('r', f1(30 + 520 * eo(rq, 4))); h1.ring.setAttribute('stroke-width', f2(3 * (1 - rq) + 0.6)); }
  // « IMAGE. »: the spark floods the frame (Luna), its halo ahead of it
  const fq = P(t, 4.44, 0.56), fr = 2300 * ei(fq, 3.6); vis(h1.flood, fq > 0); vis(h1.floodHalo, fq > 0);
  if (fq > 0) { h1.flood.setAttribute('r', f1(fr / z)); h1.floodHalo.setAttribute('r', f1(fr * 1.5 / z + 40)); }
  // the concept line
  if (t >= 2.4) {
    if (!conceptLaid) layConcept();
    CONCEPT.forEach(([, t0], i) => { const q = sp(P(t, t0, 0.42), 9); tf(h1.words[i], `translate(0 ${f1(46 * (1 - q))})`); vis(h1.words[i], t >= t0); });
    const q = sp(P(t, 4.5, 0.3), 9); tf(h1.period, `translate(0 ${f1(46 * (1 - q))})`); vis(h1.period, t >= 4.5);
  }
}

/* ===================== 3 · SAVOIR-FAIRE — DIGITAL · DESIGN · PRODUCTION  (5 – 7.5 s) ===================== */
const kn = {}; S('rect', { width: W, height: H, fill: C.LUNA }, L3.s);
const KTR = 20, wsize = {};
const fitSize = (word, maxW, maxSize) => { let u = 0; for (const ch of word) u += G.bold[ch].adv + KTR; return Math.min(maxSize, maxW * UPM / (u - KTR)); };
[['DIGITAL', 1300, 300], ['DESIGN', 1240, 300], ['PRODUCTION', 1500, 260]].forEach(([w, mw, ms]) => { wsize[w] = fitSize(w, mw, ms); });
const capPx = (w) => CAP * wsize[w] / UPM, baseOf = (w) => H / 2 + capPx(w) / 2;
const layout = (word, ks) => { const s = wsize[word] / UPM; let x = 0; const xs = []; for (let i = 0; i < word.length; i++) { xs.push(x); x += (glyphAdv(word[i], ks[i]) + KTR) * s; } return { xs, total: x - KTR * s }; };
const paintWord = (paths, word, ks, cx = W / 2) => {
  const lay = layout(word, ks), x0 = cx - lay.total / 2, base = baseOf(word);
  [...word].forEach((ch, i) => { paths[i].setAttribute('d', glyphD(ch, ks[i], wsize[word])); tf(paths[i], `translate(${f1(x0 + lay.xs[i])} ${f1(base)})`); });
  return { x0, w: lay.total };
};
// DIGITAL — revealed in steps, its weight in steps (pixels, not curves)

const PAT = {

  star: (i, j) => { const l = i % 2 === 1, tp = j % 2 === 0; return tp ? (l ? 0 : 1) : (l ? 3 : 2); },
